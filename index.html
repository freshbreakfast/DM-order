<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>早餐食材優惠活動</title>

<style>
body {
    margin: 0;
    text-align: center;
    font-family: sans-serif;
    background: #111;
}

img {
    width: 100%;
    max-width: 600px;
    display: block;
    margin: 0 auto;
}

.buttons {
    margin: 25px 0 50px;
}

.btn {
    display: inline-block;
    padding: 15px 30px;
    margin: 10px;
    font-size: 17px;
    border-radius: 999px;
    text-decoration: none;
    color: white;
    font-weight: bold;
    letter-spacing: 1px;
    transition: 0.2s;
    animation: pulse 1.5s infinite;
}

/* hover 效果 */
.btn:hover {
    opacity: 0.9;
    transform: scale(1.05);
}

/* 門市按鈕（LINE 綠） */
.store {
    background: linear-gradient(135deg, #06C755, #04a94b);
    box-shadow: 0 6px 15px rgba(6,199,85,0.4);
}

/* 全家按鈕（白＋質感） */
.online {
    background: #ffffff;
    color: #111;
    border: 1px solid #ddd;
    box-shadow: 0 6px 15px rgba(255,255,255,0.2);
}

/* 呼吸動畫 */
@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.06); }
    100% { transform: scale(1); }
}

/* 手機版 */
@media (max-width: 768px) {
    .btn {
        display: block;
        width: 80%;
        margin: 12px auto;
    }
}
</style>
</head>

<body>

<img src="image1.png" alt="第1頁">
<img src="image2.png" alt="第2頁">
<img src="image3.png" alt="第3頁">

<div class="buttons">

<a href="https://freshbreakfast.github.io/order-group/"
   target="_blank"
   class="btn store">
👉 按此 立即下單（門市取貨）
</a>

<a href="https://famistore.famiport.com.tw/users/2903801"
   target="_blank"
   class="btn online">
👉 按此 立即下單（全家店到店取貨）
</a>

</div>

</body>
</html>
