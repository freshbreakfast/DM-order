img {

.btn {

    text-decoration: none;
    color: white;
    font-weight: bold;
    letter-spacing: 1px;

    animation: pulse 1.5s infinite;
}

.btn:hover {

.store {
    background: linear-gradient(135deg, #06C755, #04a94b);

}

@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.06); }
    100% { transform: scale(1); }
}

@media (max-width: 768px) {
    .btn {
        display: block;
        width: 80%;
        margin: 12px auto;
    }
}

/* 🔥 浮動按鈕 */
.fixed-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    background: #111;
    padding: 10px;

}

.fixed-btn {
    display: block;
    background: #06C755;
    color: #fff;
    text-align: center;
    padding: 15px;
    border-radius: 999px;
    font-size: 18px;
